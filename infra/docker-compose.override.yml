# Supabase Self-Hosted — Google OAuth Configuration Override
# 
# Place this file in your Supabase Docker installation directory alongside
# the main docker-compose.yml. Docker Compose automatically merges it.
#
# See: https://supabase.com/docs/guides/self-hosting/docker

services:
  auth:
    environment:
      # Google OAuth App credentials
      # Create at: https://console.cloud.google.com/apis/credentials
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-YOUR_GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-http://192.168.10.50:8000/auth/v1/callback}
      
      # Allow the Flutter app's custom scheme as a valid post-auth redirect
      GOTRUE_URI_ALLOW_LIST: "attendanceapp://login-callback"
      
      # Restrict sign-ups to university email domain only
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
