worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8000;

        # Health probe
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"ats-supabase-gateway"}';
        }

        # PostgREST REST API
        location /rest/v1/ {
            set $upstream_postgrest http://postgrest:3000;
            proxy_pass $upstream_postgrest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Supabase GoTrue Auth API
        location /auth/v1/ {
            set $upstream_auth http://auth:9999;
            proxy_pass $upstream_auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root gateway info
        location / {
            default_type application/json;
            return 200 '{"name":"ATS Supabase Unified Gateway","status":"online"}';
        }
    }
}
