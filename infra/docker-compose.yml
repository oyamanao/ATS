services:
  postgres:
    image: postgres:16-alpine
    container_name: ats-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - ats_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ats-network

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: ats-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:postgrespassword@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-chars-long
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  auth:
    image: supabase/gotrue:v2.158.1
    container_name: ats-auth
    restart: unless-stopped
    environment:
      API_EXTERNAL_URL: http://localhost:8000/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: attendanceapp://login-callback
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-chars-long
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://192.168.10.50:8000/auth/v1/callback
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-network

  gateway:
    image: nginx:alpine
    container_name: ats-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgrest
      - auth
    networks:
      - ats-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ats-backend:latest
    container_name: ats-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      SUPABASE_URL: http://gateway:8000
      SUPABASE_SERVICE_ROLE_KEY: super-secret-jwt-token-with-at-least-32-chars-long
      ALLOWED_EMAIL_DOMAIN: "@iiitdwd.ac.in"
      SHARED_CLASS_SECRET: "KVKXG2LEMYFA===="
      TOTP_INTERVAL: 10
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - ats-network

networks:
  ats-network:
    driver: bridge

volumes:
  ats_pgdata:
    driver: local
