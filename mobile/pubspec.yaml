name: attendance_app
description: Cheat-Proof Indoor Attendance Tracker for IIIT Dharwad
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  geolocator: ^13.0.1
  flutter_beacon:
    path: packages/flutter_beacon
  network_info_plus: ^6.1.0
  biometric_signature: ^13.2.0
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.0
  http: ^1.2.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
